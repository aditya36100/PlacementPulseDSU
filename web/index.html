<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
   <meta name="color-scheme" content="light">
   <title>PlacementPulse</title>
   <meta name="theme-color" content="#13152E">
   <link rel="manifest" href="manifest.webmanifest">
   <link rel="apple-touch-icon" href="icon-192.png">
   <meta name="apple-mobile-web-app-capable" content="yes">
   <meta name="mobile-web-app-capable" content="yes">
   <link rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2313152E'/%3E%3Cpath d='M5 16h5l3-8 5 16 3-8h6' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
   <style>
      :root {
         box-sizing: border-box;
         padding-top: env(safe-area-inset-top, 0px);
         padding-bottom: env(safe-area-inset-bottom, 0px);
         --bg: #F5F6FB;
         --side: #13152E;
         --ink: #15172E;
         --mut: #6A6F8E;
         --line: #E5E8F3;
         --ac: #5A5AF5;
         --acs: #ECECFF;
         --mint: #0FA97F;
         --warn: #F2622E;
         --amb: #E9A100
      }

      html {
         height: 100%;
         scroll-padding-top: env(safe-area-inset-top, 0px)
      }

      * {
         box-sizing: border-box
      }

      body {
         margin: 0;
         height: 100%;
         background: #DCE1F0;
         font-family: 'Onest', system-ui, -apple-system, sans-serif;
         color: var(--ink);
         -webkit-text-size-adjust: 100%
      }

      button {
         font: inherit;
         color: inherit;
         cursor: pointer;
         border: 0;
         background: none;
         padding: 0
      }

      input,
      select {
         font: inherit;
         color: inherit
      }

      h1,
      h2,
      h3,
      h4,
      p {
         margin: 0
      }

      ul,
      ol,
      blockquote {
         margin: 0;
         padding: 0
      }

      :focus-visible {
         outline: 2px solid var(--ac);
         outline-offset: 2px
      }

      .wrap {
         height: 100%;
         padding: 16px;
         min-height: 640px
      }

      .app {
         position: relative;
         display: grid;
         grid-template-columns: 76px 440px 1fr;
         height: 100%;
         background: #fff;
         border-radius: 28px;
         overflow: hidden;
         box-shadow: 0 30px 80px -30px rgba(30, 30, 90, .25), 0 0 0 1px rgba(30, 30, 90, .06)
      }

      /* sidebar */
      .side {
         background: var(--side);
         display: flex;
         flex-direction: column;
         align-items: center;
         padding: 18px 0;
         gap: 8px
      }

      .side .lg {
         width: 44px;
         height: 44px;
         border-radius: 15px;
         background: linear-gradient(135deg, #8A8AFF, #4646E6);
         display: grid;
         place-items: center;
         margin-bottom: 18px;
         color: #fff
      }

      .side button {
         position: relative;
         width: 46px;
         height: 46px;
         border-radius: 15px;
         display: grid;
         place-items: center;
         color: #8E93B8;
         transition: background .15s, color .15s
      }

      .side button:hover {
         background: rgba(255, 255, 255, .07);
         color: #fff
      }

      .side button.on {
         background: rgba(255, 255, 255, .15);
         color: #fff
      }

      .side button.has::before {
         content: "";
         position: absolute;
         top: 9px;
         right: 9px;
         width: 9px;
         height: 9px;
         border-radius: 50%;
         background: #FF7A59;
         box-shadow: 0 0 0 2px var(--side)
      }

      .side button[data-savedonly].on svg {
         fill: currentColor
      }

      .side button::after {
         content: attr(data-tip);
         position: absolute;
         left: calc(100% + 12px);
         top: 50%;
         transform: translateY(-50%);
         background: #0B0C20;
         color: #fff;
         font-size: 12.5px;
         font-weight: 600;
         padding: 6px 10px;
         border-radius: 8px;
         white-space: nowrap;
         opacity: 0;
         pointer-events: none;
         transition: opacity .15s;
         z-index: 40
      }

      .side button:hover::after,
      .side button:focus-visible::after {
         opacity: 1
      }

      .side button.on::after {
         display: none
      }

      .side :focus-visible {
         outline-color: #fff
      }

      /* list column */
      .list {
         display: flex;
         flex-direction: column;
         min-height: 0;
         border-right: 1px solid var(--line);
         background: #fff
      }

      .lh {
         padding: 22px 20px 16px;
         display: grid;
         gap: 14px;
         border-bottom: 1px solid var(--line)
      }

      .lh h1 {
         font-size: 23px;
         font-weight: 700;
         letter-spacing: -.025em;
         display: flex;
         align-items: baseline;
         justify-content: space-between
      }

      .lh h1 small {
         font-size: 13px;
         font-weight: 500;
         color: var(--mut)
      }

      .srch {
         display: flex;
         align-items: center;
         gap: 8px;
         background: var(--bg);
         border-radius: 12px;
         padding: 0 12px;
         height: 44px;
         color: var(--mut)
      }

      .srch input {
         border: 0;
         outline: 0;
         background: none;
         flex: 1;
         min-width: 0;
         color: var(--ink);
         height: 100%
      }

      .sg {
         display: flex;
         gap: 6px;
         flex-wrap: wrap
      }

      .sg button {
         padding: 7px 13px;
         border-radius: 99px;
         border: 1px solid var(--line);
         font-size: 13px;
         font-weight: 500;
         color: var(--mut);
         transition: background .15s
      }

      .sg button:hover {
         background: var(--bg)
      }

      .sg button.on {
         background: var(--acs);
         border-color: #C9C9FF;
         color: var(--ac);
         font-weight: 600
      }

      .two {
         display: grid;
         grid-template-columns: 1fr 1fr;
         gap: 14px
      }

      .ctl {
         display: grid;
         gap: 6px;
         min-width: 0
      }

      .cl {
         font-size: 12.5px;
         color: var(--mut);
         font-weight: 500;
         display: flex;
         justify-content: space-between
      }

      .cl b {
         color: var(--ink);
         font-weight: 700
      }

      .slct {
         position: relative;
         display: flex;
         align-items: center;
         gap: 8px;
         background: var(--bg);
         border-radius: 12px;
         padding: 0 12px;
         height: 42px;
         color: var(--mut)
      }

      .slct select {
         -webkit-appearance: none;
         appearance: none;
         border: 0;
         background: none;
         flex: 1;
         height: 100%;
         color: var(--ink);
         font-weight: 600;
         outline: 0;
         min-width: 0;
         cursor: pointer;
         padding-right: 18px;
         text-overflow: ellipsis
      }

      .slct>svg:last-child {
         position: absolute;
         right: 10px;
         pointer-events: none
      }

      .slct:focus-within {
         box-shadow: 0 0 0 2px var(--ac)
      }

      .rng {
         -webkit-appearance: none;
         appearance: none;
         width: 100%;
         height: 6px;
         border-radius: 99px;
         background: linear-gradient(to right, var(--ac) var(--p, 0%), #E1E4F2 var(--p, 0%));
         margin: 18px 0 0;
         cursor: pointer
      }

      .rng::-webkit-slider-thumb {
         -webkit-appearance: none;
         width: 22px;
         height: 22px;
         border-radius: 50%;
         background: #fff;
         border: 4px solid var(--ac);
         box-shadow: 0 2px 8px rgba(0, 0, 0, .2)
      }

      .rng::-moz-range-thumb {
         width: 14px;
         height: 14px;
         border-radius: 50%;
         background: #fff;
         border: 4px solid var(--ac)
      }

      .af {
         display: flex;
         flex-wrap: wrap;
         align-items: center;
         gap: 6px;
         padding: 10px 20px;
         border-bottom: 1px solid var(--line);
         background: #FBFBFE
      }

      .af:empty {
         display: none
      }

      .chip {
         display: inline-flex;
         align-items: center;
         gap: 6px;
         padding: 4px 5px 4px 11px;
         border-radius: 99px;
         background: var(--acs);
         color: var(--ac);
         font-size: 12.5px;
         font-weight: 600
      }

      .chip button {
         width: 18px;
         height: 18px;
         border-radius: 50%;
         display: grid;
         place-items: center;
         background: rgba(90, 90, 245, .16)
      }

      .af .all {
         margin-left: auto;
         font-size: 12.5px;
         font-weight: 600;
         color: var(--mut);
         text-decoration: underline;
         text-underline-offset: 3px
      }

      .rows {
         overflow: auto;
         flex: 1;
         min-height: 0
      }

      .row {
         display: flex;
         gap: 14px;
         width: 100%;
         text-align: left;
         padding: 16px 20px;
         border-bottom: 1px solid var(--line);
         position: relative;
         align-items: flex-start;
         transition: background .15s
      }

      .row:hover {
         background: #FAFAFF
      }

      .row.sel {
         background: var(--acs)
      }

      .row.sel::before {
         content: "";
         position: absolute;
         left: 0;
         top: 0;
         bottom: 0;
         width: 3px;
         background: var(--ac)
      }

      .rw {
         flex: 1;
         min-width: 0;
         display: grid;
         gap: 4px
      }

      .rw-t {
         display: flex;
         justify-content: space-between;
         gap: 8px
      }

      .rw-t b {
         font-weight: 650;
         font-size: 15.5px;
         white-space: nowrap;
         overflow: hidden;
         text-overflow: ellipsis
      }

      .rw-t time {
         font-size: 12px;
         color: var(--mut);
         flex: none
      }

      .rw-r {
         font-size: 13.5px;
         color: #3B3F5C;
         white-space: nowrap;
         overflow: hidden;
         text-overflow: ellipsis
      }

      .rw-l {
         display: flex;
         align-items: center;
         gap: 6px;
         font-size: 12.5px;
         color: var(--mut);
         min-width: 0
      }

      .rw-l>span:first-of-type {
         white-space: nowrap;
         overflow: hidden;
         text-overflow: ellipsis;
         min-width: 0
      }

      .rw-l svg {
         flex: none
      }

      .sep {
         width: 3px;
         height: 3px;
         border-radius: 50%;
         background: #B9BDD3;
         flex: none
      }

      .tp {
         font-weight: 600;
         white-space: nowrap
      }

      .tp.int {
         color: var(--ac)
      }

      .tp.ip {
         color: #B26A00
      }

      .tp.ft {
         color: #087A5A
      }

      .tp.oth {
         color: var(--mut)
      }

      .rw-m {
         display: flex;
         gap: 6px;
         align-items: center;
         flex-wrap: wrap;
         margin-top: 5px
      }

      .pill {
         padding: 2px 9px;
         border-radius: 99px;
         font-weight: 600;
         font-size: 12px
      }

      .pill.pk {
         background: #E3F7EF;
         color: #087A5A
      }

      .pill.b-urgent {
         background: #FFE9E0;
         color: #C4441B
      }

      .pill.b-week {
         background: #FFF1D0;
         color: #9A6400
      }

      .pill.b-later,
      .pill.b-none {
         background: #EEF0F8;
         color: #5A5F7E
      }

      .pill.b-closed {
         background: #F0F1F5;
         color: #8A8FA6
      }

      .eb {
         display: inline-flex;
         align-items: center;
         gap: 4px;
         padding: 2px 9px 2px 6px;
         border-radius: 99px;
         font-size: 12px;
         font-weight: 600
      }

      .eb svg {
         width: 13px;
         height: 13px
      }

      .eb.yes {
         background: #DDF5EA;
         color: #087A5A
      }

      .eb.no {
         background: #FDE4E0;
         color: #B3341B
      }

      .eb.maybe {
         background: #FFF1D0;
         color: #946000
      }

      .eb.open {
         background: #EEF0F8;
         color: #5A5F7E
      }

      .lgo img {
         position: absolute;
         inset: 0;
         width: 100%;
         height: 100%;
         object-fit: contain;
         box-sizing: border-box;
         padding: calc(var(--s)*.17);
         display: none
      }

      .lgo.has {
         background: #fff !important;
         box-shadow: inset 0 0 0 1px rgba(15, 18, 50, .10)
      }

      .lgo.has img {
         display: block
      }

      .lgo.has b {
         visibility: hidden
      }

      /* company logo tile */
      .lgo {
         --s: 48px;
         position: relative;
         flex: none;
         width: var(--s);
         height: var(--s);
         border-radius: calc(var(--s)*.28);
         background: var(--bg1, #4A8BE8);
         display: grid;
         place-items: center;
         overflow: hidden;
         color: #fff;
         box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06)
      }

      .lgo b {
         font-size: calc(var(--s)*.38);
         line-height: 1;
         font-weight: 700;
         letter-spacing: -.02em
      }

      .lgo.lg {
         --s: 78px
      }

      .lgo.sm {
         --s: 30px
      }

      /* detail */
      .detail {
         overflow: auto;
         background: linear-gradient(180deg, #F6F6FE, #fff 300px);
         min-height: 0;
         position: relative
      }

      .dh {
         padding: 30px 44px 0
      }

      .bk {
         display: none;
         align-items: center;
         gap: 6px;
         color: var(--ac);
         font-weight: 600;
         margin-bottom: 16px
      }

      .id {
         display: flex;
         align-items: center;
         gap: 16px
      }

      .tag {
         display: inline-block;
         font-size: 12.5px;
         font-weight: 600;
         padding: 3px 10px;
         border-radius: 99px;
         background: var(--acs);
         color: var(--ac)
      }

      .tag.ip {
         background: #FFF1D8;
         color: #9A5B00
      }

      .tag.ft {
         background: #DFF6EC;
         color: #087A5A
      }

      .tag.oth {
         background: #EEF0F8;
         color: #5A5F7E
      }

      .posted {
         display: block;
         font-size: 13px;
         color: var(--mut);
         margin-top: 7px
      }

      .dh h2 {
         font-size: 36px;
         letter-spacing: -.035em;
         margin: 18px 0 6px;
         line-height: 1.08;
         color: var(--ink)
      }

      .dh .rl {
         font-size: 17px;
         color: #3B3F5C
      }

      .metrics {
         display: grid;
         grid-template-columns: repeat(3, 1fr);
         gap: 14px;
         padding: 26px 44px
      }

      .mt {
         background: #fff;
         border: 1px solid var(--line);
         border-radius: 18px;
         padding: 18px;
         display: flex;
         flex-direction: column;
         gap: 4px;
         box-shadow: 0 8px 24px -18px rgba(40, 40, 110, .25);
         min-width: 0
      }

      .mt.rg {
         flex-direction: row;
         align-items: center;
         gap: 14px
      }

      .mt.rg>div {
         display: flex;
         flex-direction: column;
         gap: 3px
      }

      .k {
         font-size: 12.5px;
         color: var(--mut);
         font-weight: 500
      }

      .v {
         font-size: 19px;
         font-weight: 700;
         letter-spacing: -.01em;
         display: flex;
         align-items: center;
         gap: 6px;
         color: var(--ink)
      }

      .v.big {
         font-size: 34px;
         letter-spacing: -.04em;
         align-items: baseline
      }

      .v.big small {
         font-size: 14px;
         font-weight: 600;
         color: var(--mut);
         letter-spacing: 0
      }

      .s {
         font-size: 12.5px;
         color: var(--mut)
      }

      .body {
         padding: 0 44px 110px;
         display: grid;
         gap: 26px;
         max-width: 860px
      }

      .body h4 {
         font-size: 14px;
         font-weight: 700;
         margin-bottom: 10px
      }

      .body h4 em {
         font-weight: 500;
         color: var(--mut);
         margin-left: 6px;
         font-style: normal
      }

      .ck {
         list-style: none;
         display: grid;
         gap: 9px
      }

      .ck li {
         display: flex;
         gap: 10px;
         line-height: 1.45;
         color: #2E3250
      }

      .ck svg {
         flex: none;
         margin-top: 2px;
         color: var(--mint)
      }

      .chips {
         display: flex;
         flex-wrap: wrap;
         gap: 8px
      }

      .chips span {
         padding: 6px 13px;
         border-radius: 10px;
         background: #F1F2FA;
         font-size: 13.5px;
         font-weight: 500
      }

      .chips.prep span {
         background: #FFF3D6
      }

      .wa {
         background: #E7F7E1;
         border-radius: 6px 18px 18px 18px;
         padding: 14px 16px;
         line-height: 1.55;
         color: #1F3B22;
         font-size: 14px;
         max-width: 560px;
         box-shadow: 0 1px 1px rgba(0, 0, 0, .06);
         white-space: pre-wrap;
         overflow-wrap: anywhere
      }

      .wa small {
         display: block;
         margin-top: 8px;
         color: #5C7A5C;
         font-size: 12px;
         white-space: normal
      }

      /* application link banner */
      .app-link {
         display: flex;
         align-items: center;
         gap: 14px;
         border-radius: 18px;
         background: linear-gradient(135deg, #ECECFF 0%, #E5F0FF 100%);
         border: 1px solid #C9C9FF;
         padding: 16px 20px
      }

      .app-link svg {
         flex: none;
         color: var(--ac)
      }

      .app-link-body {
         display: flex;
         flex-direction: column;
         gap: 2px;
         min-width: 0;
         flex: 1
      }

      .app-link-body span {
         font-size: 12px;
         font-weight: 600;
         color: var(--ac);
         text-transform: uppercase;
         letter-spacing: .04em
      }

      .app-link-body a {
         font-size: 14px;
         font-weight: 600;
         color: #2829A0;
         word-break: break-all;
         text-decoration: none;
         overflow: hidden;
         text-overflow: ellipsis;
         white-space: nowrap;
         display: block
      }

      .app-link-body a:hover {
         text-decoration: underline
      }

      .app-link-btn {
         padding: 10px 18px;
         border-radius: 12px;
         background: var(--ac);
         color: #fff;
         font-weight: 700;
         font-size: 13.5px;
         white-space: nowrap;
         text-decoration: none;
         display: inline-block;
         flex: none;
         transition: background .15s
      }

      .app-link-btn:hover {
         background: #4545E0
      }

      .act {
         position: sticky;
         bottom: 0;
         display: flex;
         gap: 10px;
         padding: 30px 44px 20px;
         background: linear-gradient(transparent, #fff 40%);
         margin-top: -60px
      }

      .act button {
         padding: 12px 22px;
         border-radius: 12px;
         font-weight: 600;
         font-size: 14.5px
      }

      .act .pri {
         background: var(--ac);
         color: #fff;
         box-shadow: 0 4px 12px rgba(90, 90, 245, .25)
      }

      .act .pri.on {
         background: var(--ink)
      }

      .act .sec {
         background: #fff;
         border: 1px solid var(--line);
         color: var(--ink)
      }

      .act .sec.on {
         background: var(--acs);
         border-color: #C9C9FF;
         color: var(--ac)
      }

      .none {
         padding: 44px 24px;
         color: var(--mut);
         text-align: center;
         display: grid;
         gap: 12px;
         justify-items: center
      }

      .none button {
         color: var(--ac);
         font-weight: 600
      }

      /* eligibility card in detail */
      .eg {
         border-radius: 20px;
         border: 1px solid var(--line);
         background: #fff;
         padding: 18px 20px
      }

      .eg.yes {
         background: #F0FBF6;
         border-color: #BFE8D6
      }

      .eg.no {
         background: #FFF5F2;
         border-color: #F8D8CF
      }

      .eg.maybe {
         background: #FFF9E8;
         border-color: #F1DDA0
      }

      .eg-h {
         display: flex;
         align-items: center;
         gap: 12px
      }

      .eg-ic {
         width: 40px;
         height: 40px;
         border-radius: 13px;
         display: grid;
         place-items: center;
         color: #fff;
         flex: none;
         background: var(--ac)
      }

      .yes .eg-ic {
         background: #0FA97F
      }

      .no .eg-ic {
         background: #EA5E33
      }

      .maybe .eg-ic {
         background: var(--amb)
      }

      .eg-h b {
         font-size: 16px;
         font-weight: 700;
         display: block;
         color: var(--ink)
      }

      .eg-h small {
         color: var(--mut);
         font-size: 13px
      }

      .eg-h>button {
         margin-left: auto;
         color: var(--ac);
         font-weight: 600;
         font-size: 13.5px;
         white-space: nowrap
      }

      .eg-l {
         list-style: none;
         display: grid;
         margin-top: 14px;
         border-top: 1px solid rgba(0, 0, 0, .07)
      }

      .eg-l li {
         display: grid;
         grid-template-columns: 22px 92px 1fr auto;

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
   <script src="config.js"></script>
   <script>
      /* =====================================================================
         CONFIG & CURATED DATA (Matching PlacementPulse Inbox v2 screenshot)
         ===================================================================== */
      const sb = window.supabase.createClient(window.PP_CONFIG.SUPABASE_URL, window.PP_CONFIG.SUPABASE_ANON_KEY);
      const POLL_MS = 60000;

      // Curated brand colors for logos to match screenshot aesthetic
      const BRAND_COLORS = {
         'einfochips': '#3884D8',
         'qualcomm': '#2048A8',
         'texas instruments': '#D8232A',
         'cisco': '#049FD9',
         'razorpay': '#0C2340',
         'juspay': '#18A0FB',
         'bosch': '#EA1C24',
         'tata elxsi': '#1A4F8B',
         'zoho': '#E02020',
         'infosys': '#007CC3',
         'l&t': '#004B87',
         'tcs': '#242A38'
      };

      // No hardcoded sample data — dashboard is fully driven by the API
      const DEFAULT_UPDATES = [];

      /* ---------- time + formatting helpers ---------- */
      const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const DAY = 864e5;
      // Use real current time for all calculations
      let NOW = new Date(), TODAY0 = null;
      const midnight = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
      const tick = () => { NOW = new Date(); TODAY0 = midnight(NOW); };
      tick();

      const $ = (s, r) => (r || document).querySelector(s);
      const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const p2 = n => String(n).padStart(2, '0');
      const fmtD = d => d.getDate() + ' ' + MO[d.getMonth()];
      const dmy = d => p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2);
      const fmtT = d => { let h = d.getHours(), m = d.getMinutes(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + p2(m) + ' ' + ap };
      const num = n => parseFloat(Number(n).toFixed(2)).toString();
      const lpa = n => '₹' + num(n) + ' LPA';
      const r2 = v => Math.round(v * 100) / 100;
      const dkey = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      const ageDays = d => Math.round((TODAY0 - midnight(d)) / DAY);
      const dayLabel = d => { const a = ageDays(d); return a === 0 ? 'Today' : a === 1 ? 'Yesterday' : dmy(d) };
      const ago = u => {
         const a = ageDays(u.posted);
         if (a <= 0) {
            const h = (NOW - u.posted) / 36e5;
            return h < 1 ? 'Just now' : Math.max(1, Math.round(h)) + 'h ago';
         }
         return a === 1 ? 'Yesterday' : a + 'd ago';
      };
      const leftTxt = u => u.b === 'none' ? 'No deadline' : u.closed ? 'Closed' : u.days <= 0 ? 'Closes today' : u.days === 1 ? 'Closes tomorrow' : u.days + ' days left';
      const leftShort = u => u.b === 'none' ? 'No deadline' : u.closed ? 'Closed' : u.days <= 0 ? 'Today' : u.days === 1 ? 'Tomorrow' : u.days + ' days';

      /* ---------- turning DB rows into what the UI needs ---------- */
      function parseDate(v) {
         if (!v) return null; let s = String(v).trim().replace(' ', 'T');
         if (!/(Z|[+-]\d\d:?\d\d)$/.test(s)) s += 'Z';
         const d = new Date(s); return isNaN(d) ? null : d;
      }
      function parseDeadline(r) {
         const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(r.deadline_date || '');
         if (!m) return { dl: null, hasTime: false };
         let h = 23, mi = 59, has = false; const txt = r.deadline || '';
         const t = /\b(\d{1,2})(?:[:.](\d{2}))?\s*(a\.?m\.?|p\.?m\.?)(?![a-z])/i.exec(txt);
         if (t) { h = (+t[1]) % 12; if (/p/i.test(t[3])) h += 12; mi = t[2] ? +t[2] : 0; has = true }
         else { const t24 = /\b([01]?\d|2[0-3]):([0-5]\d)\b/.exec(txt); if (t24) { h = +t24[1]; mi = +t24[2]; has = true } }

      const ring = u => {

         saveProf();
         closePanel();
         results(true);
      }

      function openPanel(n) {
         S.panel = n;
         if (n === 'date') initCalView();
         const f = $('#fly');
         f.innerHTML = n === 'date' ? dateHTML() : eligHTML();
         f.classList.add('open');
         sync();
      }
      function closePanel() { S.panel = null; $('#fly').classList.remove('open'); sync() }

      function sync() {
         document.querySelectorAll('[data-f][data-v]').forEach(b => { const on = String(S[b.dataset.f]) === b.dataset.v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on) });
         document.querySelectorAll('input[data-f],select[data-f]').forEach(el => {
            if (el === document.activeElement && el.type !== 'range') return;
            el.value = S[el.dataset.f];
            if (el.type === 'range') el.style.setProperty('--p', (S.min / S.max * 100) + '%');
         });
         document.querySelectorAll('[data-min]').forEach(el => el.textContent = S.min ? '₹' + S.min + '+ LPA' : 'Any');
         const n = S.status === 'ok' ? filtered().length : 0;
         document.querySelectorAll('[data-count]').forEach(el => el.textContent = n);
         document.querySelectorAll('[data-word]').forEach(el => el.textContent = n === 1 ? 'update' : 'updates');
         $('[data-home]').classList.toggle('on', !anyFilter() && !S.panel);
         $('[data-savedonly]').classList.toggle('on', S.savedOnly);
         const d = $('[data-panel="date"]'), e = $('[data-panel="elig"]');
         d.classList.toggle('on', S.panel === 'date'); d.classList.toggle('has', S.day !== 'all');
         e.classList.toggle('on', S.panel === 'elig'); e.classList.toggle('has', profSet());
      }

      /* ---------- data loading ---------- */
      let lastSig = '', lastRender = 0;
      function setData(rows) {
         const sig = JSON.stringify(rows);
         if (S.status === 'ok' && sig === lastSig && Date.now() - lastRender < 15 * 6e4) return;
         lastSig = sig; lastRender = Date.now(); tick();
         U = rows.map(normalize).filter(Boolean).sort((a, b) => b.posted - a.posted || b.id - a.id);
         S.status = 'ok'; buildControls(); results(true);
      }
      async function load(first) {
         try {
            const { data, error } = await sb.from('placements_feed').select('*').order('date', { ascending: false }).limit(1000);
            if (error) throw error;
            setData(data || []); checkReminders();
         } catch (err) {
            console.warn('[placementpulse] fetch failed', err);
            if (first) { S.status = "error"; results(); }
         }
      }

      /* ---------- events ---------- */
      document.addEventListener('input', e => {
         const t = e.target; if (!t.dataset) return;
         if (t.dataset.f) { const f = t.dataset.f; if (f === 'min') S.min = Math.max(0, parseFloat(t.value) || 0); else S[f] = t.value; results(true); return }
         if (t.dataset.p || t.dataset.o) { updateEligSum(); return }
      });
      document.addEventListener('click', e => {
         const t = e.target; let x;
         if (S.panel && !t.closest('#fly') && !t.closest('[data-panel]')) closePanel();
         if (t.closest('[data-retry]')) { S.status = 'loading'; results(); load(true); return }
         if (x = t.closest('[data-f][data-v]')) { S[x.dataset.f] = x.dataset.v; results(true); return }
         if (t.closest('[data-home]') || t.closest('[data-clear]')) { S.type = 'all'; S.loc = 'all'; S.min = 0; S.q = ''; S.day = 'all'; S.savedOnly = false; S.onlyElig = false; if (S.panel) closePanel(); results(); return }
         if (x = t.closest('[data-panel]')) { S.panel === x.dataset.panel ? closePanel() : openPanel(x.dataset.panel); return }
         if (t.closest('[data-closepanel]')) { closePanel(); return }
         if (t.closest('[data-savedonly]')) { S.savedOnly = !S.savedOnly; results(); return }
         if (t.closest('[data-apply-elig]')) { applyEligChanges(); return }
         if (x = t.closest('[data-cal-nav]')) {
            const dir = +x.dataset.calNav;
            S.calMonth += dir;
            if (S.calMonth < 0) { S.calMonth = 11; S.calYear--; }
            else if (S.calMonth > 11) { S.calMonth = 0; S.calYear++; }
            $('#fly').innerHTML = dateHTML();
            return;
         }
         if (t.closest('[data-cal-today]')) {
            S.calYear = NOW.getFullYear();
            S.calMonth = NOW.getMonth();
            $('#fly').innerHTML = dateHTML();
            return;
         }
         if (x = t.closest('[data-cal-date]')) {
            const dt = x.dataset.calDate;
            S.day = (S.day === dt ? 'all' : dt);
            results();
            $('#fly').innerHTML = dateHTML();
            return;
         }
         if (x = t.closest('[data-day]')) {
            S.day = x.dataset.day;
            results();
            if (S.panel === 'date') $('#fly').innerHTML = dateHTML();
            return;
         }
         if (x = t.closest('[data-rm]')) {
            const k = x.dataset.rm;
            if (k === 'day') { S.day = 'all'; if (S.panel === 'date') $('#fly').innerHTML = dateHTML(); }
            if (k === 'saved') S.savedOnly = false;
            if (k === 'elig') S.onlyElig = false;
            results();
            return;
         }
         if (x = t.closest('[data-nb]')) {
            const wasOn = x.classList.contains('on');
            document.querySelectorAll('#fly [data-nb]').forEach(b => b.classList.remove('on'));
            if (!wasOn) x.classList.add('on');
            updateEligSum();
            return;
         }
         if (t.closest('[data-clearprof]')) {
            S.prof = { branch: '', batch: '', cgpa: '', c10: '', c12: '', nb: '' };
            S.onlyElig = false;
            saveProf();
            openPanel('elig');
            results(true);
            return;
         }
         if (x = t.closest('[data-select]')) { S.sel = x.dataset.select; document.querySelectorAll('.row').forEach(r => r.classList.toggle('sel', r === x)); detail(U.find(u => u.id === S.sel)); $('#app').classList.add('show-d'); return }
         if (t.closest('[data-back]')) { $('#app').classList.remove('show-d'); return }
         if (x = t.closest('[data-tog]')) {
            const k = x.dataset.tog, set = S[k], id = x.dataset.id; set.has(id) ? set.delete(id) : set.add(id); store.set(k === 'saved' ? 'pw_saved_v1' : 'pw_rem_v1', [...set]); if (k === 'rem') { remDone.delete(id); store.set('pw_remdone_v1', [...remDone]); if (set.has(id) && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission().then(checkReminders); else checkReminders(); } detail(U.find(u => u.id === id), true);
            if (S.savedOnly && k === 'saved') results(true); return
         }
      });
      document.addEventListener('keydown', e => {
         if (e.key === 'Escape' && S.panel) closePanel();
         if (e.key === 'Enter' && S.panel === 'elig' && e.target && e.target.matches && e.target.matches('.fld')) {
            e.preventDefault();
            applyEligChanges();
         }
      });

      /* ---------- auth, live updates, notifications ---------- */
      function loginView(err) {
         $('#app').innerHTML = '<form id="lf" style="margin:auto;display:grid;gap:12px;width:min(320px,86vw);padding:24px"><h1>PlacementPulse</h1>' +
            '<input id="em" type="email" placeholder="Email" autocomplete="username" required style="padding:12px;font:inherit">' +
            '<input id="pw" type="password" placeholder="Password" autocomplete="current-password" required style="padding:12px;font:inherit">' +
            '<button style="padding:12px;font:inherit">Sign in</button><p style="color:#c33;margin:0">' + esc(err || '') + '</p></form>';
         $('#lf').onsubmit = async e => {
            e.preventDefault();
            const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
            error ? loginView(error.message) : boot();
         };
      }
      function notify(r) {
         if (!('Notification' in window) || Notification.permission !== 'granted') return;
         const title = (r.company || 'New update') + (r.group_name ? ' \u00b7 ' + r.group_name : '');
         const opts = { body: r.summary || r.roles || '', icon: 'icon-192.png', tag: r.chat_id + ':' + r.message_id };
         if (navigator.serviceWorker) navigator.serviceWorker.ready.then(reg => reg.showNotification(title, opts)).catch(() => { });
         else try { new Notification(title, opts) } catch (e) { }
      }
      async function registerPush() {
         const t = window.__PUSH_TOKEN; if (!t) return;
         const { data: { user } } = await sb.auth.getUser();
         if (user) await sb.from('push_tokens').upsert({ token: t, user_id: user.id });
      }
      window.addEventListener('pushtoken', registerPush);
      let booted = false;
      async function boot() {
         if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
         const { data: { session } } = await sb.auth.getSession();
         if (!session) return loginView();
         registerPush();
         if (booted) return; booted = true;
         shell(); load(true);
         setInterval(() => load(false), 5 * 6e4);
         document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false); });
         addEventListener('online', () => load(false));
         sb.channel('pp-live').on('postgres_changes', { event: '*', schema: 'public', table: 'placements' }, p => {
            if (p.eventType === 'INSERT') notify(p.new);
            load(false);
         }).subscribe();
         if ('Notification' in window && Notification.permission === 'default') {
            const b = document.createElement('button');
            b.textContent = 'Enable alerts';
            b.style.cssText = 'position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99;padding:10px 14px;border-radius:99px;border:0;background:#13152E;color:#fff;font:inherit';
            b.onclick = () => Notification.requestPermission().then(() => b.remove());
            document.body.appendChild(b);
         }
      }
      boot();
   </script>
</body>
